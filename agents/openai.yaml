interface:
  display_name: "Collage B-Roll"
  short_description: "Metaphor approval -> Still-frame approval -> Omni Flash paper-collage assembly"
  default_prompt: "Use $gbro-collage-broll to turn this ~5-second voiceover line into a premium editorial halftone paper-collage B-roll clip. Strictly follow the three-stage approval process: first propose the visual metaphor and wait for approval; upon approval, prepare the still frame (or manual image guide) and wait for approval; upon still-frame approval, generate the 5-second 9:16 assembly animation package (supporting manual prompt export for Google Omni / Flow or automated API generation) with audio-stripping and QA contact sheets."
policy:
  allow_implicit_invocation: true
